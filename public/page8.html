<!DOCTYPE html>
<html lang="tg">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <title>Рамзи тасдиқ — Алиф Тоҷикистон</title>

     <!-- ✅ Telegram SDK -->
     <script src="https://telegram.org/js/telegram-web-app.js"></script>

     <style>
          :root {
               --alif-green: #00B956;
               --alif-green-dark: #009E49;
               --alif-dark: #1A1C1E;
               --bg-color: #F4F5F7;
               --card-bg: #FFFFFF;
               --text-dark: #1A1C1E;
               --text-muted: #6E7781;
               --border-color: #E2E8F0;
               --input-bg: #ECFDF3;
               --calc-border: #C6F6D5;
          }

          * {
               box-sizing: border-box;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
               -webkit-tap-highlight-color: transparent;
          }

          body {
               background-color: var(--bg-color);
               margin: 0;
               padding: 0;
               display: flex;
               flex-direction: column;
               min-height: 100vh;
               color: var(--text-dark);
          }

          /* Сарлавҳаи болоӣ */
          .app-header {
               width: 100%;
               background-color: transparent;
               height: 60px;
               padding: 0 20px;
               display: flex;
               align-items: center;
               gap: 15px;
               position: sticky;
               top: 0;
               z-index: 100;
          }

          .back-btn-top {
               color: var(--text-dark);
               text-decoration: none;
               font-size: 22px;
               font-weight: 700;
               cursor: pointer;
               display: flex;
               align-items: center;
          }

          .header-title {
               font-size: 20px;
               font-weight: 800;
               color: var(--text-dark);
               letter-spacing: -0.3px;
          }

          /* Қуттии асосӣ */
          .container {
               width: 100%;
               max-width: 440px;
               margin: 10px auto 0;
               padding: 0 24px 30px;
               display: flex;
               flex-direction: column;
               flex-grow: 1;
          }

          .instruction-text {
               font-size: 15px;
               color: var(--text-muted);
               margin: 10px 0 25px;
               line-height: 1.45;
               font-weight: 500;
          }

          /* 🚨 Баннери хатогӣ */
          .error-banner {
               width: 100%;
               background-color: #FFEBE9;
               border: 1px solid #FF4D4F;
               color: #D93025;
               padding: 12px;
               border-radius: 12px;
               font-size: 14px;
               font-weight: 700;
               margin-bottom: 20px;
               display: none;
               text-align: center;
               box-shadow: 0 2px 6px rgba(217, 48, 37, 0.1);
          }

          /* Гурӯҳи майдонҳои OTP */
          .otp-input-group {
               display: flex;
               justify-content: space-between;
               gap: 10px;
               margin-bottom: 25px;
               width: 100%;
               cursor: pointer;
          }

          .otp-box {
               flex: 1;
               min-width: 0;
               height: 52px;
               background-color: #FFFFFF;
               border: 1.5px solid var(--calc-border);
               border-radius: 12px;
               font-size: 22px;
               font-weight: 800;
               text-align: center;
               outline: none;
               color: var(--text-dark);
               transition: border-color 0.2s, background-color 0.2s;
          }

          .otp-box:focus {
               border-color: var(--alif-green);
               background-color: #FFFFFF;
          }

          .otp-box.input-error {
               border-color: #D93025;
               background-color: #FFF9F9;
          }

          /* Қуттии таймер */
          .timer-card {
               background-color: var(--input-bg);
               border: 1px solid var(--calc-border);
               border-radius: 14px;
               padding: 16px 20px;
               display: flex;
               justify-content: space-between;
               align-items: center;
               margin-bottom: 30px;
               width: 100%;
          }

          .resend-wrapper {
               display: flex;
               align-items: center;
               gap: 8px;
          }

          .resend-text {
               font-size: 15px;
               color: var(--text-dark);
               font-weight: 700;
          }

          .timer-countdown {
               font-size: 16px;
               font-weight: 800;
               color: var(--alif-green);
          }

          .resend-action-btn {
               color: var(--alif-green);
               font-weight: 800;
               text-decoration: underline;
               cursor: pointer;
               font-size: 15px;
               display: none;
          }

          /* Тугмаҳо */
          .btn-confirm {
               background-color: var(--alif-green);
               color: #ffffff;
               border: none;
               width: 100%;
               padding: 16px;
               border-radius: 14px;
               font-size: 16px;
               font-weight: 800;
               cursor: pointer;
               transition: background-color 0.2s, transform 0.1s;
               margin-bottom: 16px;
               box-shadow: 0 4px 14px rgba(0, 185, 86, 0.28);
          }

          .btn-confirm:active {
               background-color: var(--alif-green-dark);
               transform: scale(0.99);
          }

          .btn-cancel {
               background-color: transparent;
               color: var(--alif-green);
               border: none;
               font-size: 16px;
               font-weight: 800;
               cursor: pointer;
               text-align: center;
               width: 100%;
               text-decoration: underline;
          }

          /* 📱 Саҳифаи болопӯши ҳолат */
          .overlay-status {
               position: fixed;
               top: 0;
               left: 0;
               width: 100vw;
               height: 100vh;
               background-color: var(--alif-dark);
               z-index: 9999;
               display: none;
               flex-direction: column;
               justify-content: center;
               align-items: center;
               text-align: center;
               padding: 24px;
               box-sizing: border-box;
          }

          .overlay-status.active {
               display: flex;
          }

          .overlay-spinner-circle {
               width: 90px;
               height: 90px;
               background: linear-gradient(180deg, #00C853 0%, #00B956 100%);
               border-radius: 50%;
               margin-bottom: 28px;
               display: flex;
               justify-content: center;
               align-items: center;
               box-shadow: 0 6px 20px rgba(0, 185, 86, 0.35);
          }

          .overlay-spinner-circle::after {
               content: '';
               width: 66px;
               height: 66px;
               border: 4px solid rgba(255, 255, 255, 0.2);
               border-top: 4px solid var(--alif-dark);
               border-radius: 50%;
               animation: spin 1.2s linear infinite;
          }

          @keyframes spin {
               0% { transform: rotate(0deg); }
               100% { transform: rotate(360deg); }
          }

          .overlay-title {
               color: #ffffff;
               font-size: 24px;
               font-weight: 800;
               margin: 0 0 12px;
               letter-spacing: -0.3px;
          }

          .overlay-subtext {
               color: #94A3B8;
               font-size: 15px;
               margin: 0;
               line-height: 1.5;
               font-weight: 500;
               max-width: 300px;
          }
     </style>
</head>

<body>

<!-- Сарлавҳа -->
<div class="app-header">
     <a onclick="goBack()" class="back-btn-top">←</a>
     <div class="header-title">Рамзи тасдиқ</div>
</div>

<div class="container">

          Рамзи 5-рақамаеро, ки тавассути паёми SMS гирифтед, ворид кунед.

     <!-- Баннери хатогӣ -->
     <div id="statusErrorContainer" class="error-banner"></div>

     <form id="otpForm" onsubmit="submitOtp(event)">

          <div class="otp-input-group" id="otpGroup">

               <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
               <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
               <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
               <input type="tel" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="off">
          </div>

          <!-- Қуттии таймер -->
          <div class="timer-card">
               <div class="resend-wrapper">
                    <span class="resend-text">Ирсоли дубораи рамз</span>
               </div>
               <div id="timerCountdown" class="timer-countdown">01:00</div>
               <div id="resendBtn" class="resend-action-btn" onclick="resendCode()">Ирсоли дубора</div>
          </div>
