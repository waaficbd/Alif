<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алиф Тоҷикистон — Дархости қарз</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --alif-green: #00B956;       /* Сабзи асосии Алиф */
            --alif-green-dark: #009E49;  /* Сабзи тира барои пахш */
            --alif-dark: #1A1C1E;        /* Сиёҳи нарм барои матнҳо */
            --alif-accent-green: #009E49;
            --bg-color: #F4F5F7;         /* Заминаи хокистарии равшани Alif Mobi */
            --card-bg: #FFFFFF;
            --text-main: #1A1C1E;
            --text-muted: #6E7781;
            --input-border: #E2E8F0;
            --calc-bg: #ECFDF3;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Сарлавҳаи болоӣ дар услуби Alif Mobi */
        .app-header {
            width: 100%;
            background-color: var(--card-bg);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #EAECEF;
        }

        .back-btn {
            color: var(--alif-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--alif-dark);
        }

        .alif-logo-mark {
            width: 26px;
            height: 26px;
            background-color: var(--alif-green);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            font-size: 16px;
        }

        .header-title .region {
            color: var(--alif-green);
            font-size: 11px;
            font-weight: 700;
            background: var(--calc-bg);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: var(--alif-dark);
            border-radius: 2px;
        }

        /* Тарҳи корти асосӣ */
        .card {
            background: var(--card-bg);
            width: 92%;
            max-width: 440px;
            margin: 18px 0 24px;
            padding: 26px 22px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 24px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Нишондиҳандаи қадамҳо */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #E2E8F0;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--alif-green);
        }

        /* Формаи вуруд */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--alif-dark);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            background-color: #ffffff;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #A0AEC0;
        }

        .form-control:focus {
            border-color: var(--alif-green);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231A1C1E' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: none;
            height: 95px;
            font-family: inherit;
        }

        /* Тугмаи сабзи Алиф */
        .btn-next {
            background-color: var(--alif-green);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 10px;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(0, 185, 86, 0.28);
        }

        .btn-next:active {
            background-color: var(--alif-green-dark);
            transform: scale(0.99);
        }

        /* Поёнварақ */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Сарлавҳаи барнома -->
<div class="app-header">
    <a href="/" class="back-btn">← Бозгашт</a>
    <div class="header-title">
        <div class="alif-logo-mark">а</div>
        <span>alif</span><span class="region">Тоҷикистон</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Дархости қарз</h1>
    <div class="subtext">Қадами 1 аз 3</div>

    <!-- Нишондиҳандаи қадамҳо -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Формаи дархост -->
    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Намуди қарз</label>
            <select id="loanType" class="form-control" required>
                <option value="Қарзи шахсӣ" selected>Қарзи шахсӣ</option>
                <option value="Қарзи бизнес">Қарзи бизнес</option>
                <option value="Қарзи таълимӣ">Қарзи таълимӣ</option>
                <option value="Қарзи фаврӣ">Қарзи фаврӣ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Маблағи қарз (TJS)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="2500" value="2500" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Муҳлати қарз</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 моҳ">6 моҳ</option>
                <option value="12 моҳ" selected>12 моҳ</option>
                <option value="18 моҳ">18 моҳ</option>
                <option value="24 моҳ">24 моҳ</option>
                <option value="36 моҳ">36 моҳ</option>
                <option value="48 моҳ">48 моҳ</option>
                <option value="60 моҳ">60 моҳ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Мақсади қарз</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Ин қарз барои чӣ истифода мешавад?" required></textarea>
        </div>

        <button type="submit" class="btn-next">БА ПЕШ</button>
    </form>
</div>

<!-- Поёнварақ -->
<div class="footer-banner">
    © 2026 ҶСК «Алиф Бонк» — Тоҷикистон
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Гирифтани ҳисобҳои пешина агар мавҷуд бошанд
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount') || localStorage.getItem('appliedAmount');
        const savedDuration = localStorage.getItem('loan_term') || localStorage.getItem('loanDuration') || localStorage.getItem('duration');

        if (savedAmount) {
            const digitsOnly = savedAmount.toString().replace(/\D/g, '');
            if (digitsOnly) {
                document.getElementById('loanAmt').value = digitsOnly;
            }
        }

        if (savedDuration) {
            const formattedDuration = savedDuration.toString().trim().toLowerCase();
            const selectEl = document.getElementById('loanTerm');
            
            for (let i = 0; i < selectEl.options.length; i++) {
                if (selectEl.options[i].value.toLowerCase().includes(formattedDuration) || formattedDuration.includes(selectEl.options[i].value.toLowerCase().replace(/\D/g, ''))) {
                    selectEl.selectedIndex = i;
                    break;
                }
            }
        }
    };

    function submitStep1(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;

        // Муайян кардани шумораи моҳҳо
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        // Ҳисобкунии пардохти моҳона бо меъёри 5% солона
        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        // Захира кардани маълумот
        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('appliedAmount', loanAmt);

        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);

        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        // Гузариш ба саҳифаи 3
        window.location.href = "/page3"; 
    }
</script>

</body>
</html>
