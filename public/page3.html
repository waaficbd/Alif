<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алиф Тоҷикистон — Дархости қарз</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --alif-green: #00B956;       /* Сабзи асосии Алиф */
            --alif-green-dark: #009E49;  /* Сабзи тира барои пахш */
            --alif-dark: #1A1C1E;        /* Сиёҳи нарм барои матнҳо */
            --alif-accent-green: #009E49;
            --bg-color: #F4F5F7;         /* Заминаи хокистарии равшани Alif Mobi */
            --card-bg: #FFFFFF;
            --text-main: #1A1C1E;
            --text-muted: #6E7781;
            --input-border: #E2E8F0;
            --calc-bg: #ECFDF3;
            --calc-border: #C6F6D5;
            --btn-gray: #F0F2F5;
            --btn-gray-text: #444444;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Сарлавҳаи болоӣ дар услуби Alif Mobi */
        .app-header {
            width: 100%;
            background-color: var(--card-bg);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #EAECEF;
        }

        .back-btn-top {
            color: var(--alif-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--alif-dark);
        }

        .alif-logo-mark {
            width: 26px;
            height: 26px;
            background-color: var(--alif-green);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            font-size: 16px;
        }

        .header-title .region {
            color: var(--alif-green);
            font-size: 11px;
            font-weight: 700;
            background: var(--calc-bg);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: var(--alif-dark);
            border-radius: 2px;
        }

        /* Тарҳи корти асосӣ */
        .card {
            background: var(--card-bg);
            width: 92%;
            max-width: 440px;
            margin: 18px 0 24px;
            padding: 26px 22px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 24px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Нишондиҳандаи қадамҳо */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #E2E8F0;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--alif-green);
        }

        /* Формаи вуруд */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--alif-dark);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            background-color: #ffffff;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #A0AEC0;
        }

        .form-control:focus {
            border-color: var(--alif-green);
        }

        /* Қисмати рақами телефон */
        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--calc-bg);
            border: 2px solid var(--calc-border);
            border-radius: 12px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 15px;
            color: var(--alif-dark);
            white-space: nowrap;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Тугмаҳо */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #E2E6EA;
        }

        .btn-next {
            background-color: var(--alif-green);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(0, 185, 86, 0.28);
        }

        .btn-next:active {
            background-color: var(--alif-green-dark);
            transform: scale(0.99);
        }

        /* Поёнварақ */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Сарлавҳаи барнома -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Бозгашт</a>
    <div class="header-title">
        <div class="alif-logo-mark">а</div>
        <span>alif</span><span class="region">Тоҷикистон</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Дархости қарз</h1>
    <div class="subtext">Қадами 2 аз 3</div>

    <!-- Нишондиҳандаи қадамҳо (Қадамҳои 1 ва 2 фаъол) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Формаи маълумоти шахсӣ -->
    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Ном</label>
            <input type="text" id="firstName" class="form-control" placeholder="Рустам" required>
        </div>

        <div class="form-group">
            <label for="lastName">Насаб</label>
            <input type="text" id="lastName" class="form-control" placeholder="Раҳимов" required>
        </div>

        <div class="form-group">
            <label for="email">Суроғаи электронӣ (Email)</label>
            <input type="email" id="email" class="form-control" placeholder="rustam.rahimov@example.tj" required>
        </div>

        <div class="form-group">
            <label for="phone">Рақами телефони Alif Mobi</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span class="flag-icon">🇹🇯</span>
                    <span>+992</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="901234567" maxlength="9" pattern="[0-9]{9}" required>
            </div>
            <div class="phone-hint">9 рақам (масалан, 901234567)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">ҚАБЛӢ</button>
            <button type="submit" class="btn-next">БА ПЕШ</button>
        </div>
    </form>
</div>

<!-- Поёнварақ -->
<div class="footer-banner">
    © 2026 ҶСК «Алиф Бонк» — Тоҷикистон
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Пур кардани худкори маълумоти захирашудаи корбар
        const fName = localStorage.getItem('firstName');
        const lName = localStorage.getItem('lastName');
        const email = localStorage.getItem('email');
        const phone = localStorage.getItem('phone');

        if (fName) document.getElementById('firstName').value = fName;
        if (lName) document.getElementById('lastName').value = lName;
        if (email) document.getElementById('email').value = email;
        if (phone) document.getElementById('phone').value = phone;
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !email || !phone) {
            alert("Лутфан ҳамаи майдонҳоро пур кунед.");
            return;
        }

        if (!/^\d{9}$/.test(phone)) {
            alert("Лутфан рақами дурусти 9-рақамаи Alif Mobi-ро ворид кунед.");
            return;
        }

        // Захира кардани маълумот
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        
        // Захира кардани рақами телефон барои тасдиқи API
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
